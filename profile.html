<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    :root{
      --sidebar: #b6b6b6;
      --sidebarText: #000000;
      --content: #ffffff;
      --codeBg: #ffffff;
      --codeLine: #2d2d2d;
      --accent: #4caf50;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(#d9f0ff, #e8ffe6);
    }

    /* Layout umum */
    .container {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
    }

    /* Sidebar kiri */
    .sidebar {
      background: var(--sidebar);
      color: var(--sidebarText);
      padding: 20px;
    }

    .brand {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .menu {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .menu li {
      padding: 8px 6px;
      border-radius: 4px;
    }

    .menu li + li {
      margin-top: 6px;
    }

    .menu a {
      color: #000000;
      text-decoration: none;
      display: block;
      padding: 8px;
      border-radius: 4px;
    }

    .menu a:hover {
      background: #ffffff;
    }

    /* =========================
       SEARCH BOX
       ========================= */

    .search-box {
      display: flex;
      width: 100%;
      margin: 15px 0;
    }

    .search-box input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #999;
      border-radius: 6px;
      outline: none;
      font-size: 14px;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    /* Pesan ketika tidak ditemukan */
    #no-result {
      display: none;
      font-size: 13px;
      color: #555;
      padding: 8px;
    }

    /* Panel konten utama */
    .content {
      padding: 20px;
      background: var(--content);
    }

    .title {
      font-size: 28px;
      font-weight: 600;
      color: #000000;
      margin-bottom: 14px;
    }

    .github {
      display: flex;
      justify-content: right;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- =========================
         SIDEBAR KIRI
         ========================= -->
    <aside class="sidebar" aria-label="Menu utama">

      <img src="PP.jpEg" width="200" height="200" />

      <!-- SEARCH BOX -->
      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="Search..."
          autocomplete="off"
        />
      </div>

      <!-- MENU -->
      <ul class="menu" id="menuList">

        <li>
          <a href="profile.html">
            Profile
          </a>
        </li>

        <li>
          <a href="index.html">
            Pengantar Web Mining
          </a>
        </li>

        <li>
          <a href="#">
          </a>
        </li>

        <li>
          <a href="#">
          </a>
        </li>

        <li>
          <a href="#">
          </a>
        </li>

      </ul>

      <!-- PESAN JIKA TIDAK ADA HASIL -->
      <div id="no-result">
        Halaman tidak ditemukan.
      </div>

    </aside>


    <!-- Konten utama -->
    <main class="content" role="main">
      <div class="github">
        <a href="https://github.com/PramudyaRakaUtomo1/ppw">
          <img
            src="github_PNG40.png"
            width="50"
            height="50"
          />
        </a>
      </div>

      <h1>Profile</h1>
      <p>Nama : Pramudya Raka Utomo</p>
      <p>Nim : 210411100058</p>
      <p>Email : mercurymeatgt@gmail.com</p>
      </section>

      
    </main>
  </div>
  

  <!-- =========================
       JAVASCRIPT SEARCH
       ========================= -->
  <script>

    const searchInput = document.getElementById("searchInput");
    const menuItems = document.querySelectorAll("#menuList li");
    const noResult = document.getElementById("no-result");

    searchInput.addEventListener("input", function () {

      // Mengambil teks yang diketik
      const keyword = this.value.toLowerCase().trim();

      let found = false;

      menuItems.forEach(function (item) {

        // Mengambil teks dari menu
        const text = item.textContent.toLowerCase();

        // Jangan tampilkan menu kosong
        const link = item.querySelector("a");

        if (!link || link.textContent.trim() === "") {
          item.style.display = "none";
          return;
        }

        // Jika keyword ditemukan
        if (text.includes(keyword)) {

          item.style.display = "block";
          found = true;

        } else {

          item.style.display = "none";

        }

      });

      // Menampilkan pesan jika tidak ada hasil
      if (keyword !== "" && !found) {
        noResult.style.display = "block";
      } else {
        noResult.style.display = "none";
      }

    });

  </script>

</body>
</html>
